<!doctype html>
<html lang="en">

<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link

    rel="stylesheet" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="dist/index.css">
  <title>Cloud Streaming</title>

<body>
  <!-- полная вложенность классов по БЭМ -->
  <header class="header" aria-label="header section">
    <div class="container">
      <nav class="header__nav nav" aria-label="header navigation">
        <div class="nav__logo">
          <a href="#" class="nav__logo-link" aria-label="logo link to main page">CLOUD <span>FLEX</span></a>
        </div>

        <div class="nav__links">
          <ul class="nav__links-list list" aria-label="header navigation links">
            <li class="list__item">
              <a href="#" class="list__item-link" aria-label="info about us">about us</a>
            </li>
            <li class="list__item">
              <a href="#" class="list__item-link" aria-label="contact us">contact</a>
            </li>
          </ul>
        </div>

        <div class="nav__covid-wrapper covid">
          <a href="#" class="covid__link" aria-label="covid-19 update">COVID-19 UPDATE</a>
        </div>

        <div class="nav__earth-wrapper earth">
          <a href="#" class="earth__link" aria-label="earth info">
            <svg class="earth__link-icon" aria-label="earth img">
              <use href="assets/sprites.svg#earth-icon"></use>
            </svg>
          </a>
        </div>
      </nav>
    </div>
  </header>


  <main class="main" aria-label="main content">

      <section class="hero" aria-label="hero section">

          <div class="hero__content content">
            <h1 class="content__title">WHEN PERFORMANCE MATTERS</h1>

              <button class="notify__info-btn">ACCEPT</button>

          </div>
        </div>
